name: KCOS Read Gate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  read-gate:
    name: KCOS-READ-GATE-001
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch pinned gate checker
        run: |
          curl -fsSL "https://raw.githubusercontent.com/ahlis0201-ui/kcos-governance-engine/0e6334e312702a7a83aa20d92e67892c57fa214f/tools/kcos-read-gate/check-read-gate.mjs" -o /tmp/kcos-read-gate.mjs
      - name: Execute gate
        env:
          KCOS_REPO: ${{ github.repository }}
          KCOS_SSOT_REPO: ahlis0201-ui/kcos-governance-engine
          KCOS_SSOT_PATH: docs/governance/document-lifecycle/KCOS-DOCUMENT-LIFECYCLE-GOVERNANCE-SSOT-V1.0.md
          KCOS_SSOT_SHA: 3d8db073b2f05aeca681cca4fbf00f27fb8597fd
          KCOS_RECEIPT_PATH: docs/governance/read-gate/READ-RECEIPT.md
        run: node /tmp/kcos-read-gate.mjs
